name: Update Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Profile Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: lucasnobres
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Streak
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          USERNAME: lucasnobres
          OUTPUT_PATH: streak.svg
          THEME: dark
          HIDE_BORDER: true
          BACKGROUND: 0D1117
          RING: 00E5FF
          FIRE: 58A6FF
          CURR_STREAK_LABEL: 00E5FF
          SIDE_LABELS: 8B949E
          DATES: 8B949E

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy.svg streak.svg

          git diff --cached --quiet || git commit -m "chore: update profile cards"

          git push