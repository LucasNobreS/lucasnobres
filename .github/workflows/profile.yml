name: Update Profile Cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Profile Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: lucasnobres
          file: ./trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: darkhub
          max-cols: 6
          max-rows: 2
          margin-width: 8
          margin-height: 8
          no-background: true
          no-frame: true

      - name: Commit generated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub trophy"
            git push
          fi