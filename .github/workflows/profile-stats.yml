name: Generate Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Profile Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: lucasnobres
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Streak
        run: |
          mkdir -p stats
          curl -L \
            "https://streak-stats.demolab.com/?user=lucasnobres&theme=dark&hide_border=true&background=0D1117&ring=00E5FF&fire=58A6FF&currStreakLabel=00E5FF&sideLabels=8B949E&dates=8B949E" \
            -o stats/github-streak.svg

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg stats/github-streak.svg
          git diff --cached --quiet || git commit -m "chore: update profile statistics"
          git push